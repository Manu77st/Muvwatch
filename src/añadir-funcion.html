<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir funcion</title>
   <link rel="stylesheet" href="../styles/styles-cliente.css">
      <link rel="stylesheet" href="../styles/style-admin.css">
      <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />


</head>
<body>
      <nav class="navbar">
        <div class="container-navbar">
          <div class="navbar-left">
            <a href="lobby-cliente.html" class="logo-link">
              <img id="logo-nav" src="/images/Logo.svg" alt="Logo_muvwatch" />
            </a>
          </div>
          <div class="navbar-center">
            <div class="container-search">
              <div class="filtros">
                <span
                  class="material-symbols-outlined icon-inline"
                  aria-hidden="true"
                  onclick="filtro()"
                  >filter_alt</span
                >
              </div>
              <div class="caja-busqueda">
                <input
                  id="search-input"
                  type="text"
                  placeholder="Buscar función..."
                />
                <span class="material-symbols-outlined" onclick="busquedas()"
                  >search</span
                >
              </div>
            </div>
          </div>
          <div class="navbar-right">
            <div class="cliente-box" id="clienteBox">
              <span
                class="material-symbols-outlined icon-inline profile-icon"
                aria-hidden="true"
                >account_circle</span
              >
              Cliente A
              <div class="menu-cliente" id="menuCliente">
                <a href="#">Perfil</a>
                <a href="/src/login.html">Cerrar sesión</a>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <div class="menu-secundario">
        <nav>
          <a
            href="lobby_admin.html"
            class="enlace-a"
            style="border-bottom-color: #3b7ba6; background: #f5f5f5"
            >Inicio</a>
          <a href="Reportes-ventas.html">Reportes</a>
          <a href="Consultar-clientes-VIP.html">Clientes VIP</a>
        </nav>
      </div>
    </header>
    <div id="resultados"></div>
    <div class="contenedor-funcion">
  <h2 class="titulo-funcion">AÑADIR FUNCIÓN</h2>

  <form class="form-funcion">
    <div class="form-izquierda">
      <label class="image-upload">
        <input type="file" accept="image/*">
        <div class="preview">
          <span class="icono">📷</span>
          <p>Insertar imagen</p>
          <small>formato .jpg, .png</small>
        </div>
      </label>

      <input type="text" placeholder="Nombre de la película">
      <textarea placeholder="Descripción"></textarea>
    </div>

    <div class="form-derecha">
      <div class="grupo">
        <input type="text" placeholder="Clasificación">
        <input type="text" placeholder="Géneros">
      </div>

      <div class="grupo">
        <input type="text" placeholder="Reparto">
        <input type="text" placeholder="Director">
      </div>

      <div class="grupo">
        <input type="number" placeholder="Precio">
        <input type="number" placeholder="Descuento">
      </div>

      <div class="grupo">
        <input type="datetime-local" placeholder="Horario">
        <input type="text" placeholder="Sala">
      </div>

      <div class="grupo">
        <input type="url" placeholder="Enlace del tráiler">
        <input type="date" placeholder="Publicación">
      </div>
    </div>
  </form>

  <div class="botones-funcion">
    <button class="btn-cancelar">Cancelar</button>
    <button class="btn-agregar">Agregar</button>
  </div>
</div>

</body>
</html>
