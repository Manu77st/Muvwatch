    <div class="contenedor-funcion">
        <h2 class="titulo-funcion">AÑADIR FUNCIÓN</h2>

        <!-- IMPORTANTE: action y method para llamar a guardar_funcion.php -->
        <form class="form-funcion" action="../backend/admin/guardar_funcion.php" method="POST" enctype="multipart/form-data">
            <div class="form-izquierda">
                <label class="image-upload">
                    <!-- Por ahora el backend no guarda la imagen, pero dejamos el name para más adelante -->
                    <input type="file" name="poster" accept="image/*">
                    <div class="preview">
                        <span class="icono">📷</span>
                        <p>Insertar imagen</p>
                        <small>formato .jpg, .png</small>
                    </div>
                </label>

                <!-- name="nombre" y name="descripcion" usados en guardar_funcion.php -->
                <input type="text" name="nombre" placeholder="Nombre de la película" required>
                <textarea name="descripcion" placeholder="Descripción" required></textarea>
            </div>

            <div class="form-derecha">
                <div class="grupo">
                    <input type="text" name="clasificacion" placeholder="Clasificación" required>
                    <input type="text" name="genero" placeholder="Géneros" required>
                </div>

                <div class="grupo">
                    <input type="text" name="reparto" placeholder="Reparto" required>
                    <input type="text" name="director" placeholder="Director" required>
                </div>

                <div class="grupo">
                    <input type="number" name="precio" placeholder="Precio" step="0.01" min="0" required>
                    <input type="number" name="descuento" placeholder="Descuento" step="0.01" min="0" value="0">
                </div>

                <div class="grupo">
                    <!-- datetime-local: el PHP ya corta a YYYY-MM-DD -->
                    <input type="datetime-local" name="fecha_funcion" placeholder="Horario" required>
                    <!-- id_sala numérico para que el cast a int funcione bien -->
                    <input type="number" name="id_sala" placeholder="Sala" min="1" value="1" required>
                </div>

                <div class="grupo">
                    <input type="url" name="trailer" placeholder="Enlace del tráiler">
                    <input type="date" name="fecha_estreno" placeholder="Publicación">
                </div>
            </div>

            <div class="botones-funcion">
                <button type="button" class="btn-cancelar" onclick="window.location.href='/proyecto/Muvwatch/backend/admin/lobby_admin.php'">
                    Cancelar
                </button>
                <button type="submit" class="btn-agregar">
                    Agregar
                </button>
            </div>
        </form>
