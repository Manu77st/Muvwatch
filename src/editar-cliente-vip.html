<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente VIP</title>
     <link rel="stylesheet" href="../styles/styles-cliente.css">
      <link rel="stylesheet" href="../styles/style-admin.css">
      <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />


</head>
<body>
      <nav class="navbar">
        <div class="container-navbar">
          <div class="navbar-left">
            <a href="lobby-cliente.html" class="logo-link">
              <img id="logo-nav" src="/images/Logo.svg" alt="Logo_muvwatch" />
            </a>
          </div>
          <div class="navbar-center">
            <div class="container-search">
              <div class="filtros">
                <span
                  class="material-symbols-outlined icon-inline"
                  aria-hidden="true"
                  onclick="filtro()"
                  >filter_alt</span
                >
              </div>
              <div class="caja-busqueda">
                <input
                  id="search-input"
                  type="text"
                  placeholder="Buscar función..."
                />
                <span class="material-symbols-outlined" onclick="busquedas()"
                  >search</span
                >
              </div>
            </div>
          </div>
          <div class="navbar-right">
            <div class="cliente-box" id="clienteBox">
              <span
                class="material-symbols-outlined icon-inline profile-icon"
                aria-hidden="true"
                >account_circle</span
              >
              Cliente A
              <div class="menu-cliente" id="menuCliente">
                <a href="#">Perfil</a>
                <a href="/src/login.html">Cerrar sesión</a>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <div class="menu-secundario">
        <a
            href="lobby_admin.html"
            class="enlace-a"
            style="border-bottom-color: #3b7ba6; background: #f5f5f5"
            >Inicio</a>
          <a href="Reportes-ventas.html">Reportes</a>
          <a href="Consultar-clientes-VIP.html">Clientes VIP</a>
      </div>
    </header>
    <div id="resultados"></div>
    <main class="container-vip">
        <h2 class="titulo-vip">EDITAR CLIENTE VIP</h2>

        <form class="form-vip">
            <div class="campo">
                <input type="text" placeholder="Nombre" value="Breiner" required>
                <input type="text" placeholder="Apellido" value="Duran" required>
            </div>

            <div class="campo">
                <input type="text" placeholder="Tipo de documento" value="CC" required>
                <input type="text" placeholder="N. de documento" value="1065127509" required>
            </div>

            <div class="campo">
                <input type="email" placeholder="Correo electrónico" value="breiner@gmail.com" required>
                <input type="tel" placeholder="Teléfono" value="3224577941" required>
            </div>

            <div class="campo">
                <input type="text" placeholder="Membresía" value="13459461" required>
                <input type="text" placeholder="Estado" value="Inactivo" required>
            </div>

            <div class="botones">
                <button type="button" class="btn-cancelar" onclick="window.location.href='Consultar-clientes-VIP.html'">Cancelar</button>
                <button type="submit" class="btn-guardar">Actualizar</button>
            </div>
        </form>
    </main>
</body>

</html>
