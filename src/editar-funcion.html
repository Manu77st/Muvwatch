<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Función</title>
     <link rel="stylesheet" href="../styles/styles-cliente.css">
      <link rel="stylesheet" href="../styles/style-admin.css">
      <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />


</head>
<body>
      <nav class="navbar">
        <div class="container-navbar">
          <div class="navbar-left">
            <a href="lobby-cliente.html" class="logo-link">
              <img id="logo-nav" src="/images/Logo.svg" alt="Logo_muvwatch" />
            </a>
          </div>
          <div class="navbar-center">
              <!-- Barra de búsqueda eliminada -->
          </div>
          <div class="navbar-right">
            <div class="cliente-box" id="clienteBox">
              <span
                class="material-symbols-outlined icon-inline profile-icon"
                aria-hidden="true"
                >account_circle</span
              >
                Administrador
              <div class="menu-cliente" id="menuCliente">
                <a href="#">Perfil</a>
                <a href="/src/login.html">Cerrar sesión</a>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <div class="menu-secundario">
        <nav>
          <a
            href="lobby_admin.html"
            class="enlace-a"
            style="border-bottom-color: #3b7ba6; background: #f5f5f5"
            >Inicio</a>
          <a href="Reportes-ventas.html">Reportes</a>
          <a href="Consultar-clientes-VIP.html">Clientes VIP</a>
        </nav>
      </div>
    </header>
    <div id="resultados"></div>

    <main class="contenedor-funcion">
        <h2 class="titulo-funcion">EDITAR FUNCIÓN</h2>

        <form class="form-funcion">
            <div class="form-izquierda">
                <div class="movie-poster-section">
                    <img src="https://via.placeholder.com/200x300/000000/FFFFFF?text=Mission+Impossible" alt="Mission Impossible" class="movie-poster">
                </div>

                <input type="text" placeholder="Nombre de la película" value="Mission Impossible">
                <textarea placeholder="Descripción">un agente de la Fuerza</textarea>
            </div>

            <div class="form-derecha">
                <div class="grupo">
                    <div class="info-display">
                        <label>Clasificación:</label>
                        <span>PG-13</span>
                    </div>
                    <div class="info-display">
                        <label>Géneros:</label>
                        <span>Acción</span>
                    </div>
                </div>

                <div class="grupo">
                    <div class="info-display">
                        <label>Reparto:</label>
                        <span>Tom Cruise, Jon Voight, Emmanuelle Beart, Henry Czerny, Jean Reno, Ving Rhames</span>
                    </div>
                    <div class="info-display">
                        <label>Director:</label>
                        <span>Brian De Palma</span>
                    </div>
                </div>

                <div class="grupo">
                    <input type="number" placeholder="Precio" value="20000">
                    <input type="number" placeholder="Descuento" value="0">
                </div>

                <div class="grupo">
                    <input type="url" placeholder="Enlace del Trailer" value="trailer">
                </div>

                <div class="grupo">
                    <input type="datetime-local" placeholder="Horario">
                    <input type="text" placeholder="Sala">
                </div>

                <div class="grupo">
                    <input type="date" placeholder="Publicación">
                </div>
            </div>
        </form>

        <div class="botones-funcion">
            <button class="btn-cancelar" onclick="window.location.href='lobby_admin.html'">Cancelar</button>
            <button class="btn-agregar">Actualizar</button>
        </div>
    </main>
</body>

</html>
