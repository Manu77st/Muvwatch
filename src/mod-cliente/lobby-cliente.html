<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lobby Cliente</title>
  <link rel="stylesheet" href="../../styles/styles-cliente.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
  <!-- Header y Navbar -->
  <header>
    <nav class="navbar">
      <div class="container-navbar">
        <!-- Logo -->
        <div class="navbar-left">
          <a href="lobby-cliente.html" class="logo-link">
            <img id="logo-nav" src="../../images/Logo.svg" alt="Logo_muvwatch" />
          </a>
        </div>

        <!-- Buscador -->
        <div class="navbar-center">
          <div class="container-search">
            <div class="filtros">
              <span class="material-symbols-outlined icon-inline" aria-hidden="true" onclick="filtro()">filter_alt</span>
            </div>
            <div class="caja-busqueda">
              <input id="search-input" type="text" placeholder="Buscar función..." />
              <span class="material-symbols-outlined" onclick="busquedas()">search</span>
            </div>
          </div>
        </div>

        <!-- Perfil Cliente -->
        <div class="navbar-right">
          <div class="cliente-box" id="clienteBox">
            <span class="material-symbols-outlined icon-inline profile-icon" aria-hidden="true">account_circle</span>
            
            <div class="menu-cliente" id="menuCliente">
              <a href="#">Perfil</a>
              <a href="../../src/login.html">Cerrar sesión</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Menú secundario -->
    <div class="menu-secundario">
      <nav>
        <a href="lobby-cliente.html" class="enlace-a" style="border-bottom-color: #3b7ba6; background: #f5f5f5">Inicio</a>
        <a href="../mod-cliente/promociones.html" class="enlace-a">Promociones</a>
        <a href="contactanos.html" class="enlace-a">Contactanos</a>
        <a href="../mod-cliente/carrito.html" class="enlace-a">Carrito</a>
      </nav>
    </div>
  </header>

  <!-- Contenedor de resultados -->
  <div id="resultados"></div>

  <!-- Contenido principal: Grid de películas -->
  <main class="main-content">
    <div class="movies-grid" id="moviesGrid">
      <!-- Aquí se inyectarán dinámicamente las películas desde JS -->
    </div>
  </main>

  <!-- Modal de detalles de película -->
  <div id="movieModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeMovieModal()">&times;</span>
      <div class="modal-body">
        <div class="modal-left">
          <img id="modalMovieImage" src="../../images/Peliculas_Cartelera" alt="Movie Poster" />
          <h2 id="modalMovieTitle"></h2>
        </div>
        <div class="modal-right">
          <div class="synopsis-section">
            <h3 class="data-titulo">Sinopsis</h3>
            <p id="modalSynopsis"></p>
          </div>
          <div class="movie-details">
            <p><strong>Nombre original:</strong> <span id="modalOriginalName"></span></p>
            <p><strong>Clasificación:</strong> <span id="modalClassification"></span></p>
            <p><strong>Reparto:</strong> <span id="modalCast"></span></p>
            <p><strong>Director:</strong> <span id="modalDirector"></span></p>
          </div>
          <div class="trailer-section">
            <h3 class="data-titulo">Trailer</h3>
            <div class="trailer-placeholder">
              <span class="material-symbols-outlined">play_circle</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón y ventana de chatbot -->
  <div class="chatbot-btn" id="chatbotBtn">
    <span class="material-symbols-outlined">chat</span>
  </div>

  <div class="chatbot-window" id="chatbotWindow">
    <div class="chatbot-header">
       <span class="material-symbols-outlined" style="background-color: white; color: blue; width: 50px; border-radius: 10px; padding-left: 10px; height: 35px; font-size: 30px;">smart_toy</span>
      <span>
        Chatsito Muvwatch
      </span>
      <span class="chatbot-close" id="chatbotClose">&times;</span>
    </div>
    <div class="chatbot-body">
  </div>

  <!-- Script -->
  <script src="../../scripts/mod-cliente/cliente-mod.js"></script>
</body>
</html>
