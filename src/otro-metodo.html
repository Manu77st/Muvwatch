<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero - Muvwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../styles/styles-cajero.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="logo-section">
            <a href=""><img src="../images/Logo-reducido.png" alt="logotipo" class="logo"></a>
        </div>
        <h1 class="header-title">Información de venta</h1>
    </header>
    <main class="main-content">
        <div>
            <button class="btn-back" onclick="window.history.back()">Regresar</button>
        </div>
        <div class="container">
            <div class="card left-section">
                <div class="info-row">
                    <span class="info-label">Función:</span>
                    <span class="info-value" id="venta_funcion">Mission impossible</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Fecha:</span>
                    <span class="info-value" id="venta_fecha">30/08/2025</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Hora:</span>
                    <span class="info-value" id="venta_hora">9:20 pm</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Sala:</span>
                    <span class="info-value" id="venta_sala">4</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Sillas:</span>
                    <span class="info-value" id="venta_sillas">C5, C6</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Bloque:</span>
                    <span class="info-value" id="venta_bloque">1</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Precio total:</span>
                    <span class="info-value" id="venta_precio">$$$$</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Descuento:</span>
                    <span class="info-value" id="venta_descuento">10%</span>
                </div>
                
                <div class="payment-method">
                    <h2 class="section-title">Método de pago</h2>
                    <div class="radio-option">
                        <input type="radio" id="credit" name="payment" value="credit" checked>
                        <label for="credit">Tarjeta de crédito</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="debit" name="payment" value="debit">
                        <label for="debit">Tarjeta de débito</label>
                    </div>
                </div>
            </div>
            
            <div class="card" id="creditCard">
                <h2 class="section-title">Info. crédito</h2>
                <div class="form-group">
                    <label class="form-label" for="credit-number">N° tarjeta:</label>
                    <input id="credit-number" type="text" class="form-input" placeholder="Ej. 4111 1111 1111 1111" maxlength="16" title="Número de tarjeta de crédito">
                </div>
                <div class="form-group">
                    <label class="form-label" for="credit-holder">Titular:</label>
                    <input id="credit-holder" type="text" class="form-input" placeholder="Nombre tal como figura en la tarjeta" title="Nombre del titular de la tarjeta">
                </div>
                <div class="form-group">
                    <label class="form-label" for="credit-type">Tipo tarjeta:</label>
                    <input id="credit-type" type="text" class="form-input" placeholder="Visa, MasterCard, etc." title="Tipo de la tarjeta">
                </div>
            </div>
            
            <div class="card hidden" id="debitCard">
                <h2 class="section-title">Info. débito</h2>
                <div class="form-group">
                    <label class="form-label" for="debit-number">N° tarjeta:</label>
                    <input id="debit-number" type="text" class="form-input" placeholder="Ej. 4111 1111 1111 1111" maxlength="16" title="Número de tarjeta de débito">
                </div>
                <div class="form-group">
                    <label class="form-label" for="debit-holder">Banco emisor:</label>
                    <input id="debit-holder" type="text" class="form-input" placeholder="Nombre del banco emisor" title="Nombre del banco emisor">
                </div>
                <div class="form-group">
                    <label class="form-label" for="debit-auth">C. Autorización:</label>
                    <input id="debit-auth" type="text" class="form-input" placeholder="Código de autorización" title="Código de autorización">
                </div>
            </div>
    
            <div class="pay-button-container">
                <button class="pay-button" onclick="handlePayment()">Pagar</button>
            </div>
        </div>
    </main>
    <script src="../scripts/cajero.js"></script>
        <script>
        (function(){
            const API = '../backend/api/index.php';

            function formatearMoneda(n){
                return '$' + parseFloat(n || 0).toLocaleString('es-CO');
            }

            function cargarDatosVenta(){
                const temp = sessionStorage.getItem('venta_temp');
                if(!temp) return;
                const venta = JSON.parse(temp);
                document.getElementById('venta_funcion').textContent = venta.pelicula || ('Función ' + venta.id_funcion);
                document.getElementById('venta_fecha').textContent = venta.fecha || '—';
                document.getElementById('venta_hora').textContent = venta.hora || '—';
                document.getElementById('venta_sala').textContent = venta.sala || '—';
                document.getElementById('venta_sillas').textContent = (venta.asientos || []).join(', ');
                document.getElementById('venta_precio').textContent = formatearMoneda((venta.precio_unitario || 0) * (venta.cantidad || 0));
                document.getElementById('venta_descuento').textContent = '0%';
            }

            // Toggle credit/debit card divs
            document.addEventListener('DOMContentLoaded', () => {
                cargarDatosVenta();

                const radios = document.querySelectorAll('input[name="payment"]');
                radios.forEach(r => r.addEventListener('change', (e)=>{
                    const credit = document.getElementById('creditCard');
                    const debit = document.getElementById('debitCard');
                    if(e.target.value === 'credit'){
                        credit.classList.remove('hidden'); debit.classList.add('hidden');
                    } else {
                        debit.classList.remove('hidden'); credit.classList.add('hidden');
                    }
                }));

                const payBtn = document.querySelector('.pay-button');
                if(payBtn) payBtn.addEventListener('click', handlePayment);
            });

            async function handlePayment(){
                const temp = sessionStorage.getItem('venta_temp');
                if(!temp) return alert('No hay datos de pago. Regresa a la reserva.');
                const venta = JSON.parse(temp);
                const metodo = document.querySelector('input[name="payment"]:checked')?.value || 'credit';

                // Si hay campos de tarjeta, podríamos validar aquí (minimal)
                // Crear la venta: primero crear reserva en backend y luego crear venta
                try{
                    // Llamada para crear venta (el endpoint creará reserva si es necesario)
                    const payload = {
                        id_funcion: venta.id_funcion,
                        asientos: venta.asientos,
                        metodo_pago: metodo === 'credit' ? 'tarjeta' : 'tarjeta'
                    };

                    const resp = await fetch(API + '?accion=crear_venta', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });
                    const json = await resp.json();
                    if(!json.exito) throw new Error(json.mensaje || 'Error procesando pago');

                    alert('Pago procesado. Ticket: ' + (json.datos?.numero_ticket || 'N/A'));
                    // limpiar temporal
                    sessionStorage.removeItem('venta_temp');
                    // Redirigir al carrito (mis reservas / historial)
                    window.location.href = 'carrito.html';
                } catch(err){
                    console.error(err);
                    alert('Error procesando pago: ' + err.message);
                }
            }
        })();
        </script>
</body>

</html>
